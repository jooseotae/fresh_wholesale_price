<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가락시장 도매시세 · 농산</title>
<style>
/* ============================================================
   shadcn/ui design system (neutral base) — ported to plain CSS.
   Tokens mirror ui.shadcn.com defaults: neutral palette, --radius
   0.625rem with sm/md/lg/xl derivatives, shadow-xs/sm, ring focus.
   No build step, no Tailwind — just the same visual language.
   ============================================================ */
:root{
  /* --- shadcn base tokens (Tailwind neutral scale) --- */
  --background:#f5f5f5;      /* page ground = muted, keeps cards readable */
  --foreground:#0a0a0a;
  --card:#ffffff;
  --card-foreground:#0a0a0a;
  --primary:#171717;
  --primary-foreground:#fafafa;
  --secondary:#f5f5f5;
  --muted-bg:#f5f5f5;
  --muted-foreground:#737373;
  --accent:#f0f0f0;
  --border:#e5e5e5;
  --input:#e5e5e5;
  --ring:#a1a1a1;
  --ring-a:rgba(161,161,161,.45);

  /* --- radius scale (shadcn: --radius 0.625rem) --- */
  --radius:10px;
  --radius-sm:6px;
  --radius-md:8px;
  --radius-lg:10px;
  --radius-xl:14px;

  /* --- elevation (shadow-xs / shadow-sm) --- */
  --shadow-xs:0 1px 2px 0 rgba(0,0,0,.05);
  --shadow-sm:0 1px 3px 0 rgba(0,0,0,.06),0 1px 2px -1px rgba(0,0,0,.06);

  /* --- domain semantics, tuned to sit inside the neutral palette --- */
  --up:#dc2626;   --up-a:rgba(220,38,38,.10);   --up-b:rgba(220,38,38,.30);
  --down:#2563eb; --down-a:rgba(37,99,235,.10); --down-b:rgba(37,99,235,.30);
  --flat:#a1a1a1;
  --cheong:#c2410c; --chae:#15803d; --yang:#6d28d9;

  /* --- legacy aliases so existing rules keep working --- */
  --bg:var(--background); --ink:var(--foreground);
  --muted:var(--muted-foreground); --line:var(--border);
  --soft:var(--secondary); --sh:var(--shadow-xs);
}
@media (prefers-color-scheme:dark){:root{
  --background:#0a0a0a;
  --foreground:#fafafa;
  --card:#171717;
  --card-foreground:#fafafa;
  --primary:#fafafa;
  --primary-foreground:#171717;
  --secondary:#262626;
  --muted-bg:#262626;
  --muted-foreground:#a1a1a1;
  --accent:#262626;
  --border:rgba(255,255,255,.10);
  --input:rgba(255,255,255,.15);
  --ring:#737373;
  --ring-a:rgba(115,115,115,.45);
  --shadow-xs:0 1px 2px 0 rgba(0,0,0,.35);
  --shadow-sm:0 1px 3px 0 rgba(0,0,0,.45),0 1px 2px -1px rgba(0,0,0,.45);
  --up:#f87171;   --up-a:rgba(248,113,113,.14);   --up-b:rgba(248,113,113,.32);
  --down:#60a5fa; --down-a:rgba(96,165,250,.14); --down-b:rgba(96,165,250,.32);
  --flat:#737373;
  --cheong:#fb923c; --chae:#4ade80; --yang:#a78bfa;
}}

*{box-sizing:border-box}
body{margin:0;padding:32px 20px 60px;background:var(--background);color:var(--foreground);
  font:14px/1.55 "Pretendard","Malgun Gothic",-apple-system,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-feature-settings:"cv02","cv03","cv04","cv11"}
.wrap{max-width:1240px;margin:0 auto}

/* shadcn focus ring: 3px ring + 1px border shift */
button:focus-visible,input:focus-visible,a:focus-visible,tr.click:focus-visible{
  outline:none;border-color:var(--ring);box-shadow:0 0 0 3px var(--ring-a)}

/* ---- typography: tracking-tight headings, text-sm body ---- */
h1{font-size:30px;font-weight:600;margin:0 0 6px;letter-spacing:-.025em;line-height:1.2}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hdr-l{min-width:0}

/* ---- Button (variant=secondary, size=lg) — 상단 큰 뒤로가기 ---- */
.bigback{font:inherit;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:9px;
  height:46px;padding:0 22px;border-radius:var(--radius-md);cursor:pointer;flex:0 0 auto;
  border:1px solid var(--border);background:var(--secondary);color:var(--foreground);box-shadow:var(--shadow-xs);
  transition:background .15s ease,color .15s ease,border-color .15s ease}
.bigback:hover{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.bigback .ar{font-size:17px;line-height:1;color:var(--muted-foreground)}
.bigback:hover .ar{color:var(--primary-foreground)}
@media (max-width:640px){.bigback{width:100%;justify-content:center;margin-top:4px}}

/* ---- 기준일 배지 — shadcn Alert 형태를 쓰되 노란 톤은 유지 ---- */
.meta{display:inline-flex;align-items:center;background:rgba(255,216,77,.26);color:#141414;
  font-size:15px;font-weight:600;padding:10px 16px;border-radius:var(--radius-lg);margin-bottom:22px;
  border:1px solid rgba(202,138,4,.32);letter-spacing:-.01em;line-height:1.45;
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.meta b{color:#000;font-weight:700;font-size:16px}
.meta-sep{color:rgba(120,90,0,.55);margin:0 8px}
@media (max-width:900px){.meta{white-space:normal}}
.meta .note{color:#6b5200;font-size:13px;margin-top:0}
@media (prefers-color-scheme:dark){
  .meta{background:rgba(250,204,21,.10);border-color:rgba(250,204,21,.22);color:#fde68a}
  .meta b{color:#fef3c7}
  .meta .note{color:#d5b45a}
}

/* ---- Section heading ---- */
h2{font-size:16px;font-weight:600;letter-spacing:-.015em;color:var(--foreground);
  margin:26px 0 12px;display:flex;align-items:center;gap:9px;line-height:1.35}
h2::before{content:"";width:3px;height:15px;background:var(--chae);border-radius:9999px;flex:0 0 auto}

/* ---- Card ---- */
.section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);
  padding:18px;box-shadow:var(--shadow-xs);margin:20px 0 0}
.section > h2{margin:0 0 14px;font-size:16px}
.section > .cards{margin-top:0}
.section > .cards > .card{box-shadow:none;background:var(--secondary);border-color:var(--border)}
.section > .cards > .hlcard{background:var(--card)}

/* ---- Tabs (TabsList + TabsTrigger) ---- */
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:18px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);
  padding:8px 10px;box-shadow:var(--shadow-xs)}
.nav .back{font:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:5px;
  height:32px;padding:0 11px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:transparent;color:var(--muted-foreground);cursor:pointer;
  transition:background .15s ease,color .15s ease,border-color .15s ease}
.nav .back:hover{background:var(--accent);color:var(--foreground)}
.nav .div{width:1px;height:20px;background:var(--border);margin:0 5px}
.nav .lvl{font:inherit;font-size:13px;font-weight:500;height:32px;padding:0 14px;
  border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;
  color:var(--muted-foreground);cursor:pointer;
  transition:background .15s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease}
.nav .lvl:hover{background:var(--accent);color:var(--foreground)}
.nav .lvl.on{background:var(--primary);color:var(--primary-foreground);
  border-color:var(--primary);box-shadow:var(--shadow-xs)}
.nav .lvl.cheong{color:var(--cheong)}
.nav .lvl.chae{color:var(--chae)}
.nav .lvl.cheong.on{background:var(--cheong);color:#fff;border-color:var(--cheong)}
.nav .lvl.chae.on{background:var(--chae);color:#fff;border-color:var(--chae)}
.nav .cur{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;
  height:32px;padding:0 6px 0 12px;border-radius:var(--radius-sm);
  background:var(--secondary);color:var(--foreground);border:1px solid var(--border)}
.nav .cur .x{font:inherit;font-size:14px;line-height:1;color:var(--muted-foreground);background:none;
  border:none;cursor:pointer;padding:0 5px;border-radius:4px}
.nav .cur .x:hover{color:var(--foreground);background:var(--accent)}
.nav .tip{font-size:12px;color:var(--muted-foreground);margin-left:auto;padding-right:4px}

/* ---- Alert (destructive) — 클릭 안내 ---- */
.hint{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;color:var(--up);
  background:var(--up-a);border:1px solid var(--up-b);border-radius:var(--radius-lg);
  padding:12px 16px;margin-bottom:12px;letter-spacing:-.015em}
td.chev{width:26px;text-align:right;color:var(--muted-foreground);font-size:15px;opacity:.4;padding-left:0}
tbody tr.click:hover td.chev{opacity:1;color:var(--foreground)}
tbody tr.click .item-link{border-bottom:1px dashed var(--muted-foreground);padding-bottom:1px}
tbody tr.click:hover .item-link{border-bottom-color:var(--foreground)}
.card.click{position:relative}
.card.click::after{content:"자세히 ›";position:absolute;top:14px;right:16px;font-size:11.5px;font-weight:500;
  color:var(--muted-foreground);background:var(--secondary);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:2px 9px}
.card.click:hover::after{color:var(--foreground);border-color:var(--ring)}

/* ---- 뉴스 ---- */
.news{margin-top:38px;border-top:1px solid var(--border);padding-top:24px}
.newslist{display:flex;flex-direction:column;gap:8px}
.newsitem{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:14px 18px;box-shadow:var(--shadow-xs);
  text-decoration:none;color:var(--foreground);
  transition:background .15s ease,border-color .15s ease}
.newsitem:hover{border-color:var(--ring);background:var(--accent)}
.newsitem .d{font-size:12.5px;font-weight:500;color:var(--muted-foreground);font-variant-numeric:tabular-nums;
  white-space:nowrap;letter-spacing:.01em;min-width:52px}
.newsitem .t{font-size:14.5px;font-weight:500;line-height:1.45;flex:1 1 auto;color:var(--foreground)}
/* Badge variant=secondary */
.newsitem .b{font-size:11.5px;color:var(--muted-foreground);background:var(--secondary);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px 8px;
  font-weight:500;white-space:nowrap}

/* ---- Breadcrumb ---- */
.crumb{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:16px;font-size:13px}
.crumb button{font:inherit;background:none;border:none;color:var(--muted-foreground);cursor:pointer;
  padding:3px 7px;border-radius:var(--radius-sm);text-decoration:none;transition:color .15s ease,background .15s ease}
.crumb button:hover{background:var(--accent);color:var(--foreground)}
.crumb .sep{color:var(--muted-foreground);opacity:.45}
.crumb .cur{font-weight:500;color:var(--foreground);padding:3px 7px}

/* ---- KPI = shadcn Card ---- */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:6px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);
  padding:18px;box-shadow:var(--shadow-xs)}
.kpi .k{font-size:13px;font-weight:500;color:var(--muted-foreground);letter-spacing:0}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.03em;margin-top:6px;
  font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:12.5px;color:var(--muted-foreground);margin-top:6px}
.kpi.acc-cheong{border-left:3px solid var(--cheong)}
.kpi.acc-chae{border-left:3px solid var(--chae)}

/* ---- 품목 소개 카드 ---- */
.intro{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--chae);
  border-radius:var(--radius-xl);padding:18px;box-shadow:var(--shadow-xs);margin:14px 0 6px}
.intro h3{margin:0 0 16px;font-size:20px;font-weight:650;display:flex;align-items:center;gap:9px;
  letter-spacing:-.015em}
.intro-grid{display:grid;gap:14px 22px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:12px}
.intro-block .lab{font-size:12px;font-weight:600;color:var(--muted-foreground);letter-spacing:.05em;
  text-transform:uppercase;margin-bottom:6px}
.intro-block .val{font-size:15.5px;font-weight:500;line-height:1.6}
/* Badge variant=secondary */
.chip{display:inline-block;padding:2px 9px;border-radius:var(--radius-sm);background:var(--secondary);
  font-size:12px;font-weight:500;margin:2px 4px 2px 0;border:1px solid var(--border);color:var(--foreground)}
.intro-block .range{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.intro-block .range .u{font-size:12.5px;font-weight:400;color:var(--muted-foreground);margin-left:4px}
.intro-block .chip{font-size:13.5px;padding:4px 12px;font-weight:600}
.intro-block .val > .note{font-size:13.5px}
.intro-points{border-top:1px solid var(--border);padding-top:14px;margin-top:6px}
.intro-points ul{margin:0;padding-left:18px}
.intro-points li{font-size:14px;line-height:1.85;color:var(--muted-foreground)}
.intro-points li b{font-weight:600;color:var(--foreground)}

/* ---- 주목 품목 카드 ---- */
.hlcard{position:relative;cursor:pointer;padding:20px;
  transition:border-color .15s ease,box-shadow .15s ease}
.hlcard:hover{border-color:var(--ring);box-shadow:var(--shadow-sm)}
.hlcard.click::after{display:none}
.hlcard .hl-tag{position:absolute;top:16px;right:16px;font-size:11.5px;font-weight:500;
  padding:2px 9px;border-radius:var(--radius-sm);letter-spacing:0}
.hlcard .hl-tag.up{background:var(--up-a);color:var(--up);border:1px solid var(--up-b)}
.hlcard .hl-tag.down{background:var(--down-a);color:var(--down);border:1px solid var(--down-b)}
.hlcard .hl-tag.vol{background:var(--secondary);color:var(--muted-foreground);border:1px solid var(--border)}
.hlcard h3{margin:0 0 16px;font-size:20px;font-weight:600;letter-spacing:-.025em;
  display:flex;align-items:center;gap:9px}
.hl-metrics{display:flex;gap:28px;margin:6px 0 4px;flex-wrap:wrap}
.hl-metric{display:flex;flex-direction:column;gap:2px}
.hl-metric .ml{font-size:12px;color:var(--muted-foreground);letter-spacing:0;margin-bottom:2px}
.hl-metric b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.hl-varieties{border-top:1px solid var(--border);padding-top:12px;margin-top:14px;font-size:12.5px;line-height:1.7}
.hl-varieties .lb{font-size:11px;font-weight:500;color:var(--muted-foreground);text-transform:uppercase;
  letter-spacing:.06em;margin-right:6px}

.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);
  padding:18px;box-shadow:var(--shadow-xs)}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:-.015em}
.card .sub{font-size:12.5px;color:var(--muted-foreground);margin-bottom:14px;line-height:1.5}
.card.click{cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease}
.card.click:hover{border-color:var(--ring);box-shadow:var(--shadow-sm)}

/* ---- Table ---- */
table{width:100%;border-collapse:collapse;caption-side:bottom}
th{text-align:left;font-size:12.5px;font-weight:500;color:var(--muted-foreground);
  height:40px;padding:0 12px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.click{cursor:pointer;transition:background .12s ease}
tbody tr.click:hover{background:var(--accent)}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);
  box-shadow:var(--shadow-xs);overflow-x:auto}
.table-wrap table{min-width:640px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.strong{font-weight:600}

/* ---- Badge (variant=outline) ---- */
.badge{display:inline-block;padding:1px 8px;border-radius:var(--radius-sm);font-size:11px;
  font-weight:500;border:1px solid currentColor;line-height:1.5}
.badge.청과{color:var(--cheong)}.badge.채소{color:var(--chae)}.badge.양곡{color:var(--yang)}

/* ---- ToggleGroup — 등급 필터 ---- */
.gradebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.gradebar .lab{font-size:12.5px;font-weight:500;color:var(--muted-foreground);margin-right:4px}
.gchip{font:inherit;font-size:12.5px;font-weight:500;height:30px;padding:0 12px;
  border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border);background:var(--card);
  color:var(--muted-foreground);transition:background .15s ease,color .15s ease,border-color .15s ease}
.gchip:hover{background:var(--accent);color:var(--foreground)}
.gchip.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.gchip .n{opacity:.6;font-size:11px;margin-left:4px}
td.gcell{white-space:nowrap}
.gtag{display:inline-block;min-width:32px;text-align:center;padding:1px 7px;border-radius:var(--radius-sm);
  font-size:11px;font-weight:500;border:1px solid currentColor;line-height:1.5}

/* ---- Input ---- */
.searchbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.search{font:inherit;font-size:13.5px;height:36px;padding:0 12px;border-radius:var(--radius-md);
  border:1px solid var(--input);background:var(--card);color:var(--foreground);
  min-width:260px;flex:0 1 340px;box-shadow:var(--shadow-xs);
  transition:border-color .15s ease,box-shadow .15s ease}
.search:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px var(--ring-a)}
.search::placeholder{color:var(--muted-foreground)}
.hits{font-size:12.5px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.clearq{font:inherit;font-size:12.5px;background:none;border:none;color:var(--muted-foreground);
  cursor:pointer;padding:4px 6px;border-radius:var(--radius-sm)}
.clearq:hover{color:var(--foreground);background:var(--accent)}

.note{font-size:12px;color:var(--muted-foreground);margin-top:8px;line-height:1.6}
.empty{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:32px;
  text-align:center;color:var(--muted-foreground);box-shadow:var(--shadow-xs)}
/* Alert (warning) */
.banner{padding:12px 15px;border-radius:var(--radius-lg);margin-bottom:16px;font-size:12.5px;
  background:rgba(250,204,21,.10);color:#713f12;border:1px solid rgba(202,138,4,.28)}
@media (prefers-color-scheme:dark){.banner{background:rgba(250,204,21,.08);color:#fde68a;
  border-color:rgba(250,204,21,.20)}}

svg{display:block;max-width:100%}
.hit{cursor:pointer}
.axis{stroke:var(--border);stroke-width:1}
.tick{fill:var(--muted-foreground);font-size:10px}
.glabel{fill:var(--foreground);font-size:11px}
.gval{fill:var(--muted-foreground);font-size:10.5px;font-variant-numeric:tabular-nums}
footer{margin-top:32px;padding-top:20px;border-top:1px solid var(--border);
  font-size:12px;color:var(--muted-foreground);line-height:1.7}
footer b{color:var(--foreground);font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-l">
      <h1>가락시장 도매시세 · 농산</h1>
      <div class="meta" id="meta"></div>
    </div>
    <button class="bigback" id="bigback" hidden><span class="ar">←</span><span id="bigbackLabel">뒤로</span></button>
  </div>
  <div class="nav" id="nav"></div>
  <div id="view"></div>
  <div class="news" id="news"></div>
  <footer>
    출처: 서울시농수산식품공사 유통정보시스템 · 경매(정가수의) 상장거래, 가격은 <b>등급 상</b> 기준, 물량 단위 <b>톤</b><br>
    경매는 당일 저녁부터 다음날 새벽에 진행되며, 과일류는 오전 11시 이후 확정됩니다. 수집은 매일 14:00.<br>
    대표품목 변동률은 <b>품종별 전일대비의 중앙값</b>입니다 — 품종마다 단위가 달라 절대가 평균은 쓰지 않았습니다.<br>

    if (!rows.length) return '<div class="note">데이터가 없습니다.</div>';
    var w = 460, rowH = 26, padL = 96, padR = 58, h = rows.length * rowH + 12;
    var max = Math.max.apply(null, rows.map(function (r) { return r.value; })) || 1;
    var bw = w - padL - padR;
    var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(opt.label || '막대그래프') + '">';
    rows.forEach(function (r, i) {
      var y = i * rowH + 6, len = Math.max(2, r.value / max * bw);
      var hit = r.item ? ' data-item="' + esc(r.item) + '" data-sector="' + esc(r.sector) + '" class="hit"' : '';
      s += '<text class="glabel" x="' + (padL - 8) + '" y="' + (y + 12) + '" text-anchor="end">' + esc(r.name) + '</text>';
      s += '<rect x="' + padL + '" y="' + y + '" width="' + len.toFixed(1) + '" height="14" rx="3" fill="' + (r.color || 'var(--chae)') + '" opacity=".85"/>';
      s += '<text class="gval" x="' + (padL + len + 6) + '" y="' + (y + 11) + '">' + n(r.value) + (opt.unit || '') +
           (r.delta == null ? '' : ' <tspan fill="' + cvar(r.delta) + '">' + pct(r.delta) + '</tspan>') + '</text>';
      if (r.item) s += '<rect x="0" y="' + y + '" width="' + w + '" height="' + (rowH - 2) + '" fill="transparent"' + hit +
        '><title>' + esc(r.name) + ' 상세 보기</title></rect>';
    });
    return s + '</svg>';
  }

  function cumBar(rows, color) {
    if (!rows.length) return '<div class="note">데이터가 없습니다.</div>';
    var w = 460, h = 220, padL = 46, padR = 14, padT = 30, padB = 40;
    var iw = w - padL - padR, ih = h - padT - padB;
    var maxCum = Math.max.apply(null, rows.map(function (r) { return r.cum || 0; })) || 1;
    var bw = iw / rows.length;
    var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="누적 반입량">';
    [0, 0.5, 1].forEach(function (t) {
      var y = padT + ih * (1 - t);
      s += '<line class="axis" x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '" opacity=".55"/>';
      s += '<text class="tick" x="' + (padL - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + n(Math.round(maxCum * t)) + 't</text>';
    });
    rows.forEach(function (r, i) {
      var x = padL + i * bw + bw * 0.15, bwx = bw * 0.7;
      var val = r.tot || 0;
      var barH = ih * (val / maxCum);
      var y = padT + ih - barH;
      s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bwx.toFixed(1) + '" height="' + barH.toFixed(1) + '" rx="2" fill="' + color + '" opacity=".65"><title>' + esc(r.date) + ' · ' + esc(r.item || '—') + ' · ' + n(val) + 't</title></rect>';
      s += '<text class="gval" x="' + (x + bwx / 2).toFixed(1) + '" y="' + (padT - 6) + '" text-anchor="middle" fill="var(--ink)">' + esc(r.item || '—') + '</text>';
      s += '<text class="tick" x="' + (x + bwx / 2).toFixed(1) + '" y="' + (h - 22) + '" text-anchor="middle">' + esc(r.date.slice(5)) + '</text>';
      s += '<text class="tick" x="' + (x + bwx / 2).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle" fill="var(--muted)">누적 ' + n(r.cum) + '</text>';
    });
    var linePts = rows.map(function (r, i) {
      var x = padL + i * bw + bw / 2;
      var y = padT + ih * (1 - (r.cum || 0) / maxCum);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    s += '<polyline points="' + linePts + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round"/>';
    rows.forEach(function (r, i) {
      var x = padL + i * bw + bw / 2;
      var y = padT + ih * (1 - (r.cum || 0) / maxCum);
      s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3" fill="' + color + '"/>';
    });
    return s + '</svg>';
  }

  function lineChart(series, opt) {
    opt = opt || {};
    var pts = (series || []).filter(function (p) { return p[1] != null; });
    if (pts.length < 2) return '<div class="note">추이를 그릴 데이터가 부족합니다.</div>';
    var w = 460, h = 150, padL = 52, padR = 12, padT = 12, padB = 26;
    var vals = pts.map(function (p) { return p[1]; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (lo === hi) { lo -= 1; hi += 1; }
    var iw = w - padL - padR, ih = h - padT - padB;
    var X = function (i) { return padL + i / (pts.length - 1) * iw; };
    var Y = function (v) { return padT + ih * (1 - (v - lo) / (hi - lo)); };
    var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p[1]).toFixed(1); }).join(' ');
    var area = d + ' L' + X(pts.length - 1).toFixed(1) + ',' + (padT + ih) + ' L' + padL + ',' + (padT + ih) + ' Z';
    var col = opt.color || 'var(--chae)';
    var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(opt.label || '추이') + '">';
    [0, 0.5, 1].forEach(function (t) {
      var y = padT + ih * t, v = hi - (hi - lo) * t;
      s += '<line class="axis" x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '" opacity=".55"/>';
      s += '<text class="tick" x="' + (padL - 7) + '" y="' + (y + 3) + '" text-anchor="end">' + n(Math.round(v)) + '</text>';
    });
    s += '<path d="' + area + '" fill="' + col + '" opacity=".10"/>';
    s += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>';
    s += '<circle cx="' + X(pts.length - 1).toFixed(1) + '" cy="' + Y(vals[vals.length - 1]).toFixed(1) + '" r="3" fill="' + col + '"/>';
    s += '<text class="tick" x="' + padL + '" y="' + (h - 8) + '">' + esc(pts[0][0].slice(5)) + '</text>';
    s += '<text class="tick" x="' + (w - padR) + '" y="' + (h - 8) + '" text-anchor="end">' + esc(pts[pts.length - 1][0].slice(5)) + '</text>';
    return s + '</svg>';
  }

  function divergingBar(rows, opt) {
    opt = opt || {};
    if (!rows.length) return '<div class="note">가격 데이터가 있는 품목이 없습니다.</div>';
    var w = 460, rowH = 24, padL = 88, padR = 52, h = rows.length * rowH + 22;
    var max = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.value); })) || 1;
    var iw = w - padL - padR, mid = padL + iw / 2, half = iw / 2;
    var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(opt.label || '가격 등락') + '">';
    s += '<line class="axis" x1="' + mid + '" y1="2" x2="' + mid + '" y2="' + (h - 18) + '"/>';
    rows.forEach(function (r, i) {
      var y = i * rowH + 5, len = Math.abs(r.value) / max * half;
      var x = r.value >= 0 ? mid : mid - len;
      s += '<text class="glabel" x="' + (padL - 8) + '" y="' + (y + 11) + '" text-anchor="end">' + esc(r.name) + '</text>';
      s += '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + Math.max(1.5, len).toFixed(1) + '" height="13" rx="2.5" fill="' + cvar(r.value) + '" opacity=".85"><title>' + esc(r.name) + ' · ' + pct(r.value) + (r.vol != null ? ' · 반입 ' + n(r.vol) + 't' : '') + '</title></rect>';
      var tx = r.value >= 0 ? mid + len + 5 : mid - len - 5;
      s += '<text class="gval" x="' + tx.toFixed(1) + '" y="' + (y + 10) + '" text-anchor="' + (r.value >= 0 ? 'start' : 'end') + '" fill="' + cvar(r.value) + '">' + pct(r.value) + '</text>';
      if (r.item) s += '<rect x="0" y="' + y + '" width="' + w + '" height="' + (rowH - 2) + '" fill="transparent" class="hit" data-item="' + esc(r.item) + '" data-sector="' + esc(r.sector) + '"><title>' + esc(r.name) + ' 상세 보기</title></rect>';
    });
    s += '<text class="tick" x="' + (mid - 6) + '" y="' + (h - 5) + '" text-anchor="end">← 하락</text>';
    s += '<text class="tick" x="' + (mid + 6) + '" y="' + (h - 5) + '">상승 →</text>';
    return s + '</svg>';
  }

  // ---------- 뷰 ----------
  function allItems() {
    var out = [];
    Object.keys(DATA.sectors).forEach(function (k) { out = out.concat(DATA.sectors[k]); });
    return out;
  }

  function renderNav() {
    // 우측 상단 큰 뒤로가기 — 최상위에서는 감춘다
    var bb = $('bigback');
    if (bb) {
      bb.hidden = state.level === 'all';
      $('bigbackLabel').textContent =
        state.level === 'item' ? (state.sector || '뒤로') + ' 목록' : '전체';
    }

    var nav = $('nav');
    var h = '';

    if (state.level !== 'all') {
      var upTo = state.level === 'item' ? esc(state.sector) : '전체';
      h += '<button class="back" data-nav="up"><span>←</span> ' + upTo + '</button><span class="div"></span>';
    }

    h += '<button class="lvl' + (state.level === 'all' ? ' on' : '') + '" data-nav="all">전체</button>';
    Object.keys(DATA.sectors).forEach(function (sec) {
      var on = state.sector === sec;
      var kls = sec === '청과' ? 'cheong' : sec === '채소' ? 'chae' : '';
      h += '<button class="lvl ' + kls + (on ? ' on' : '') + '" data-nav="sector" data-sec="' + esc(sec) + '">' +
        esc(sec) + '</button>';
    });

    if (state.item) {
      h += '<span class="div"></span><span class="cur">' + esc(state.item) +
        '<button class="x" data-nav="clear" title="품목 선택 해제">✕</button></span>';
    }
    h += '<span class="tip">' +
      (state.level === 'item' ? '부문을 눌러 다른 품목을 고를 수 있습니다'
        : state.level === 'sector' ? '부문을 눌러 바로 전환할 수 있습니다'
        : '부문을 눌러 바로 들어갈 수 있습니다') + '</span>';

    nav.innerHTML = h;

    nav.querySelectorAll('[data-nav]').forEach(function (b) {
      b.addEventListener('click', function () {
        var act = b.getAttribute('data-nav');
        if (act === 'all') state = { level: 'all', sector: null, item: null };
        else if (act === 'sector') state = { level: 'sector', sector: b.getAttribute('data-sec'), item: null };
        else if (act === 'clear') { state.level = 'sector'; state.item = null; }
        else if (act === 'up') {
          if (state.level === 'item') { state.level = 'sector'; state.item = null; }
          else state = { level: 'all', sector: null, item: null };
        }
        render(); window.scrollTo(0, 0);
      });
    });
  }

  // 전체·부문 뷰 상단에서 오늘 눈에 띄는 품목을 카드 3장으로 요약. 클릭하면 상세로.
  function highlightCard(meta, tag, tone) {
    var price = DATA.prices[meta.item];
    var vs = (price && price.varieties) ? price.varieties : [];
    var g1 = vs.filter(function (v) { return v.g === '1'; });
    if (!g1.length) g1 = vs;
    var seen = {}, nms = [];
    g1.forEach(function (v) { if (!seen[v.nm]) { seen[v.nm] = 1; nms.push(v.nm); } });
    var topNms = nms.slice(0, 3);
    var extra = price ? Math.max(0, (price.nVariety || nms.length) - topNms.length) : 0;
    var color = meta.sector === '청과' ? 'var(--cheong)' : 'var(--chae)';

    var h = '<div class="card click hlcard" data-item="' + esc(meta.item) +
      '" data-sector="' + esc(meta.sector) + '" style="border-left:4px solid ' + color + '">';
    h += '<div class="hl-tag ' + tone + '">' + esc(tag) + '</div>';
    h += '<h3>' + esc(meta.item) + ' <span class="badge ' + esc(meta.sector) + '">' +
      esc(meta.sector) + '</span></h3>';
    h += '<div class="hl-metrics">' +
      '<div class="hl-metric"><span class="ml">반입량</span><b>' + n(meta.tot) + 't</b></div>' +
      '<div class="hl-metric"><span class="ml">전일비 가격</span><b class="' + cls(meta.pricePct) + '">' +
      pct(meta.pricePct) + '</b></div>' +
      '<div class="hl-metric"><span class="ml">전일비 물량</span><b class="' + cls(meta.volPct) + '">' +
      pct(meta.volPct) + '</b></div>' +
      '</div>';
    h += '</div>';
    return h;
  }

  // 급등/급락/최다반입 각 하나. 반입량 상위군 안에서만 뽑아 소물량 노이즈를 뺀다.
  function pickHighlights(pool, allPool) {
    var priced = pool.filter(function (i) { return i.pricePct != null; });
    if (!priced.length) return [];
    var bySurge = priced.slice().sort(function (a, b) { return b.pricePct - a.pricePct; });
    var picks = [];
    var used = {};
    var gainer = bySurge[0];
    if (gainer && gainer.pricePct > 0) { picks.push({ item: gainer, tag: '급등 최고 +' + gainer.pricePct.toFixed(1) + '%', tone: 'up' }); used[gainer.item] = 1; }
    var loser = bySurge[bySurge.length - 1];
    if (loser && loser.pricePct < 0 && !used[loser.item]) { picks.push({ item: loser, tag: '급락 최고 ' + loser.pricePct.toFixed(1) + '%', tone: 'down' }); used[loser.item] = 1; }
    var byVol = allPool.slice().sort(function (a, b) { return (b.tot || 0) - (a.tot || 0); });
    for (var i = 0; i < byVol.length; i++) {
      if (!used[byVol[i].item]) { picks.push({ item: byVol[i], tag: '반입량 최다 ' + n(byVol[i].tot) + 't', tone: 'vol' }); used[byVol[i].item] = 1; break; }
    }
    return picks;
  }

  function viewAll() {
    var items = allItems();
    var total = items.reduce(function (a, b) { return a + (b.tot || 0); }, 0);
    var prev = items.reduce(function (a, b) { return a + (b.prev || 0); }, 0);
    var totPct = prev ? (total - prev) / prev * 100 : null;
    var priced = items.filter(function (i) { return i.pricePct != null; });
    // 3t짜리 품목의 +124%는 실무에서 노이즈다. 반입량 상위 품목 안에서만 급등락을 본다.
    // 부문별로 뽑아야 한다 — 전체를 한 줄로 세우면 물량이 큰 채소가 자리를 다 차지해
    // 청과가 통째로 빠진다.
    var major = [];
    Object.keys(DATA.sectors).forEach(function (k) {
      major = major.concat(DATA.sectors[k].slice(0, MAJOR_PER_SECTOR)
        .filter(function (i) { return i.pricePct != null; }));
    });
    var surge = major.filter(function (i) { return Math.abs(i.pricePct) >= 10; });

    var h = '<div class="kpis">';
    h += kpi('총 반입량', n(total) + 't', '전일 ' + n(prev) + 't · <span class="' + cls(totPct) + '">' + pct(totPct) + '</span>');
    Object.keys(DATA.sectors).forEach(function (s) {
      var it = DATA.sectors[s];
      var t = it.reduce(function (a, b) { return a + (b.tot || 0); }, 0);
      var p = it.reduce(function (a, b) { return a + (b.prev || 0); }, 0);
      h += kpi(s + ' 반입량', n(t) + 't',
        it.length + '품목 · <span class="' + cls(p ? (t - p) / p * 100 : null) + '">' + pct(p ? (t - p) / p * 100 : null) + '</span>',
        s === '청과' ? 'acc-cheong' : 'acc-chae');
    });
    h += kpi('급등락 품목', surge.length + '건', '부문별 반입량 상위 ' + MAJOR_PER_SECTOR + '품목 중 ±10% 초과');
    h += '</div>';

    var picks = pickHighlights(major, items);
    if (picks.length) {
      h += '<h2>오늘의 주목 품목 <span style="color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0"> · 카드를 누르면 상세로</span></h2>';
      h += '<div class="cards">';
      picks.forEach(function (p) { h += highlightCard(p.item, p.tag, p.tone); });
      h += '</div>';
    }

    var dv = major.slice().sort(function (a, b) { return b.pricePct - a.pricePct; });
    dv = dv.slice(0, 7).concat(dv.slice(-7)).filter(function (x, i, a) { return a.indexOf(x) === i; });
    h += '<h2>주요 품목 가격 등락</h2><div class="cards"><div class="card">' +
      '<h3>전일대비 등락</h3>' + challenge('부문별 반입량 상위 ' + MAJOR_PER_SECTOR + '품목 중 상승·하락 양극단 · 막대에 마우스를 올리면 반입량이 나옵니다') +
      divergingBar(dv.map(function (i) { return { name: i.item, value: i.pricePct, vol: i.tot, item: i.item, sector: i.sector }; }), { label: '주요 품목 전일대비 등락' }) + '</div>' +
      '<div class="card"><h3>주요 품목 급등락</h3>' + challenge('부문별 반입량 상위 ' + MAJOR_PER_SECTOR + '품목 중 전일대비 변동률 절대값 기준 · 소물량 품목 제외') +
      miniTable(major.slice().sort(function (a, b) { return Math.abs(b.pricePct) - Math.abs(a.pricePct); }).slice(0, 10)) + '</div></div>';

    h += '<h2>부문별 반입량 TOP ' + DATA.topN + '</h2><div class="cards">';
    Object.keys(DATA.sectors).forEach(function (s) {
      var rows = DATA.sectors[s].slice(0, DATA.topN).map(function (i) {
        return { name: i.item, value: i.tot, delta: i.volPct, item: i.item, sector: s,
          color: s === '청과' ? 'var(--cheong)' : 'var(--chae)' };
      });
      h += '<div class="card click" data-sector="' + esc(s) + '"><h3>' + esc(s) + '</h3>' +
challenge('막대를 클릭하면 그 품목 상세로 · 카드 여백을 클릭하면 부문 전체로') + barChart(rows, { unit: 't', label: s + ' 반입량 TOP' }) +
        '<div class="note">' + esc(s) + ' 전체 보기 →</div></div>';
    });
    h += '</div>';
    return h;
  }

  function challenge(t) { return '<div class="sub">' + esc(t) + '</div>'; }

  function kpi(k, v, s, extra) {
    return '<div class="kpi ' + (extra || '') + '"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>';
  }

  function miniTable(items) {
    if (!items.length) return '<div class="note">해당 품목이 없습니다.</div>';
    var h = '<div class="hint">👆 행을 클릭하면 품종별 상세로 들어갑니다</div>' +
      '<table><thead><tr><th>품목</th><th>부문</th><th class="num">반입(t)</th><th class="num">가격 전일비</th><th></th></tr></thead><tbody>';
    items.forEach(function (i) {
      h += '<tr class="click" data-item="' + esc(i.item) + '" data-sector="' + esc(i.sector) + '"><td><span class="item-link">' + esc(i.item) +
        '</span></td><td><span class="badge ' + esc(i.sector) + '">' + esc(i.sector) + '</span></td>' +
        '<td class="num">' + n(i.tot) + '</td><td class="num strong ' + cls(i.pricePct) + '">' + pct(i.pricePct) +
        '</td><td class="chev">›</td></tr>';
    });
    return h + '</tbody></table>';
  }

  function viewSector() {
    var items = DATA.sectors[state.sector] || [];
    var t = items.reduce(function (a, b) { return a + (b.tot || 0); }, 0);
    var p = items.reduce(function (a, b) { return a + (b.prev || 0); }, 0);
    var w = items.reduce(function (a, b) { return a + (b.week || 0); }, 0);

    var h = '<div class="kpis">';
    h += kpi('반입량', n(t) + 't', '전일 ' + n(p) + 't · <span class="' + cls(p ? (t - p) / p * 100 : null) + '">' + pct(p ? (t - p) / p * 100 : null) + '</span>');
    h += kpi('전주 대비', pct(w ? (t - w) / w * 100 : null), '전주 ' + n(w) + 't');
    var priced = items.filter(function (i) { return i.pricePct != null; }).length;
    h += kpi('품목 수 (' + state.sector + ')', items.length + '개', '가격 확인 ' + priced + '개');
    h += '</div>';

    // 부문 내 반입량 상위군에서만 급등락을 뽑는다 — 소물량 노이즈 배제
    var sectorMajor = items.slice(0, MAJOR_PER_SECTOR).filter(function (i) { return i.pricePct != null; });
    var picks = pickHighlights(sectorMajor, items);
    if (picks.length) {
      h += '<h2>오늘의 주목 품목 <span style="color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0"> · 카드를 누르면 상세로</span></h2>';
      h += '<div class="cards">';
      picks.forEach(function (p) { h += highlightCard(p.item, p.tag, p.tone); });
      h += '</div>';
    }

    var color = state.sector === '청과' ? 'var(--cheong)' : 'var(--chae)';
    var rows = items.slice(0, DATA.topN).map(function (i) {
      return { name: i.item, value: i.tot, delta: i.volPct, color: color, item: i.item, sector: i.sector };
    });
    var sv = items.filter(function (i) { return i.pricePct != null; })
      .sort(function (a, b) { return b.pricePct - a.pricePct; });
    sv = sv.slice(0, 7).concat(sv.slice(-7)).filter(function (x, i, a) { return a.indexOf(x) === i; });
    h += '<h2>가격 등락 · 반입량 TOP ' + DATA.topN + '</h2><div class="cards">' +
      '<div class="card"><h3>전일대비 등락</h3>' + challenge('막대를 클릭하면 그 품목 상세로 · 마우스를 올리면 반입량이 나옵니다') +
      divergingBar(sv.map(function (i) { return { name: i.item, value: i.pricePct, vol: i.tot, item: i.item, sector: i.sector }; })) + '</div>';

    h += '<div class="card"><h3>' + esc(state.sector) + ' 반입량</h3>' +
      challenge('막대를 클릭하면 그 품목 상세로 · 옆 숫자는 전일대비 물량 증감') + barChart(rows, { unit: 't' }) + '</div></div>';

    h += '<h2>품목 · 반입량 TOP ' + DATA.topN + ' (검색은 전 부문)</h2>';
    h += '<div class="hint">👆 행을 클릭하면 품종별 상세로 · 아래 검색은 청과·채소 전체에서 찾습니다</div>';
    h += '<div class="searchbar">' +
      '<input class="search" id="iq" type="search" autocomplete="off" placeholder="검색: 전체 부문에서 품목명으로 (예: 복숭아, 오이)">' +
      '<span class="hits" id="ihits"></span>' +
      '<button type="button" class="clearq" id="iclear" hidden>지우기</button></div>';
    h += '<div class="table-wrap"><table>' +
      '<thead><tr><th>품목</th><th>부문</th><th>대표 품종</th><th class="num">평균가</th><th class="num">단위단가</th>' +
      '<th class="num">반입(t)</th><th class="num">전일</th><th class="num">물량 전일비</th>' +
      '<th class="num">가격 전일비</th><th></th></tr></thead><tbody id="ibody">';
    var top10 = items.slice(0, DATA.topN).map(function (x) { return Object.assign({}, x, { _top: 1 }); });
    var rest = items.slice(DATA.topN).map(function (x) { return Object.assign({}, x, { _top: 0 }); });
    var other = [];
    Object.keys(DATA.sectors).forEach(function (k) {
      if (k !== state.sector) DATA.sectors[k].forEach(function (x) { other.push(Object.assign({}, x, { _top: 0 })); });
    });
    var allRows = top10.concat(rest).concat(other);
    allRows.forEach(function (i) {
      var up = i.unitPrice != null ? n(i.unitPrice) + '<span class="note"> 원/' + esc(i.unitBase || '') + '</span>' : '—';
      h += '<tr class="click" data-item="' + esc(i.item) + '" data-sector="' + esc(i.sector) + '"' +
        ' data-top="' + i._top + '"' +
        ' data-q="' + esc(((i.item || '') + ' ' + (i.repName || '')).toLowerCase()) + '">' +
        '<td class="strong"><span class="item-link">' + esc(i.item) + '</span></td>' +
        '<td><span class="badge ' + esc(i.sector) + '">' + esc(i.sector) + '</span></td>' +
        '<td>' + esc(i.repName || '—') + (i.repUnit ? ' <span class="note">' + esc(i.repUnit) + '</span>' : '') + '</td>' +
        '<td class="num strong">' + n(i.repAvg) + '</td>' +
        '<td class="num">' + up + '</td>' +
        '<td class="num">' + n(i.tot) + '</td><td class="num">' + n(i.prev) + '</td>' +
        '<td class="num ' + cls(i.volPct) + '">' + pct(i.volPct) + '</td>' +
        '<td class="num strong ' + cls(i.pricePct) + '">' + pct(i.pricePct) + '</td>' +
        '<td class="chev">›</td></tr>';
    });
    return h + '</tbody></table></div>';
  }

  // 품목 상세 상단에 붙는 요약 카드. 주품종·주요 산지·가격대·셀링포인트를 한눈에.
  function introCard(meta, price, regs) {
    var sec = state.sector;
    var accent = sec === '청과' ? 'var(--cheong)' : 'var(--chae)';
    var vs = (price && price.varieties) ? price.varieties : [];
    var g1 = vs.filter(function (v) { return v.g === '1'; });
    if (!g1.length) g1 = vs;

    // 주요 품종: 등급 상 기준 이름별 규격 수가 많은 순, 그다음 평균가 높은 순 상위 4개
    var nmCount = {}, nmSum = {};
    g1.forEach(function (v) {
      nmCount[v.nm] = (nmCount[v.nm] || 0) + 1;
      nmSum[v.nm] = Math.max(nmSum[v.nm] || 0, v.avg || 0);
    });
    var topNms = Object.keys(nmCount).sort(function (a, b) {
      return nmCount[b] - nmCount[a] || nmSum[b] - nmSum[a];
    }).slice(0, 4);

    // 주요 산지: '기타' 제외하고 등장 빈도순 상위 4개
    var regCount = {};
    regs.forEach(function (r) {
      if (r.region && r.region !== '기타') regCount[r.region] = (regCount[r.region] || 0) + 1;
    });
    var topRegs = Object.keys(regCount).sort(function (a, b) { return regCount[b] - regCount[a]; }).slice(0, 4);
    var importedOnly = regs.length > 0 && !topRegs.length;

    // 등급 상 기준 품종 평균가의 최소~최대 (가격대 감을 잡기 위함)
    var avgs = g1.map(function (v) { return v.avg; }).filter(function (x) { return x != null; });
    var minA = avgs.length ? Math.min.apply(null, avgs) : null;
    var maxA = avgs.length ? Math.max.apply(null, avgs) : null;

    // 전년비 중앙값 — 원본이 문자열로 올 수 있어 숫자로 강제 변환
    var j365s = g1.map(function (v) { return v.j365 == null ? null : +v.j365; })
      .filter(function (x) { return x != null && !isNaN(x); })
      .sort(function (a, b) { return a - b; });
    var medJ365 = j365s.length ? j365s[Math.floor(j365s.length / 2)] : null;

    // 같은 부문 내 반입량 순위
    var siblings = (DATA.sectors[sec] || []).slice()
      .sort(function (a, b) { return (b.tot || 0) - (a.tot || 0); });
    var rank = 0;
    for (var i = 0; i < siblings.length; i++) {
      if (siblings[i].item === state.item) { rank = i + 1; break; }
    }
    var rankShare = siblings.length ? Math.round(rank / siblings.length * 100) : null;

    var h = '<div class="intro" style="border-left-color:' + accent + '">';
    h += '<h3><span class="badge ' + esc(sec) + '">' + esc(sec) + '</span>' +
      esc(state.item) + ' <span style="color:var(--muted);font-weight:600">— 한눈에 보기</span></h3>';

    h += '<div class="intro-grid">';
    // 품종이 하나뿐이고 그 이름이 품목명과 같으면 제목("가지 — 한눈에 보기")을 그대로
    // 반복하는 셈이라 칩을 빼고, 대신 단일 품종이라는 사실 자체를 알려준다.
    var soleSameName = topNms.length === 1 && topNms[0] === state.item &&
      (!price || price.nVariety <= 1);
    h += '<div class="intro-block"><div class="lab">주요 품종</div><div class="val">' +
      (soleSameName ? '<span class="note">단일 품종 · 품종 구분 없음</span>'
        : topNms.length ? topNms.map(function (nm) { return '<span class="chip">' + esc(nm) + '</span>'; }).join('') +
          (price && price.nVariety > topNms.length ? '<span class="note"> · 외 ' + (price.nVariety - topNms.length) + '종</span>' : '')
        : '<span class="note">품종 정보 없음</span>') +
      '</div></div>';

    h += '<div class="intro-block"><div class="lab">주요 산지</div><div class="val">' +
      (topRegs.length ? topRegs.map(function (r) { return '<span class="chip">' + esc(r) + '</span>'; }).join('')
        : importedOnly ? '<span class="note">수입 (국내 산지 미구분)</span>'
        : '<span class="note">산지 정보 없음</span>') +
      '</div></div>';

    h += '<div class="intro-block"><div class="lab">가격대 · 등급 상</div><div class="val">' +
      (minA != null
        ? '<span class="range">' + n(Math.round(minA)) + ' ~ ' + n(Math.round(maxA)) +
          '<span class="u">원 · 품종 평균가</span></span>'
        : '<span class="note">—</span>') +
      '</div></div>';
    h += '</div>';

    // 셀링포인트 · 3~4개 짧은 문장으로
    var pts = [];
    var wPct = meta.week ? (meta.tot - meta.week) / meta.week * 100 : null;
    pts.push('가락시장 <b>' + esc(sec) + '</b> 반입량 <b>' + (rank || '—') + '위</b>' +
      (rankShare != null ? ' <span class="note">(상위 ' + rankShare + '%)</span>' : '') +
      ' · 오늘 <b>' + n(meta.tot) + 't</b>' +
      ' <span class="note">(전주비 <span class="' + cls(wPct) + '">' + pct(wPct) + '</span>)</span>');

    if (price) {
      pts.push('대표품종 <b>' + esc(price.repName) + '</b> · 평균가 <b>' + n(price.repAvg) + '원</b>' +
        (price.repUnit ? ' <span class="note">(' + esc(price.repUnit) + ')</span>' : '') +
        ' · 오늘 <span class="' + cls(meta.pricePct) + '">' + pct(meta.pricePct) + '</span>');
    }

    if (medJ365 != null) {
      pts.push('전년 동기 대비 <span class="' + cls(medJ365) + '"><b>' + pct(medJ365) + '</b></span>' +
        ' <span class="note">(품종 ' + j365s.length + '개 중앙값)</span>');
    }

    if (importedOnly) {
      pts.push('<b>수입 품목</b> — 산지는 통관 이후 집계라 국내 시군구로 나뉘지 않습니다');
    }

    h += '<div class="intro-points"><ul>';
    pts.forEach(function (p) { h += '<li>' + p + '</li>'; });
    h += '</ul></div>';
    h += '</div>';
    return h;
  }

  function viewItem() {
    var meta = allItems().filter(function (i) { return i.item === state.item; })[0] || {};
    var price = DATA.prices[state.item];
    var ser = DATA.series[state.item] || {};
    var regs = (DATA.regions || {})[state.item] || [];
    var color = state.sector === '청과' ? 'var(--cheong)' : 'var(--chae)';

    var h = '<div class="kpis">';
    h += kpi('반입량', n(meta.tot) + 't', '전일 ' + n(meta.prev) + 't · <span class="' + cls(meta.volPct) + '">' + pct(meta.volPct) + '</span>');
    h += kpi('가격 전일비', pct(meta.pricePct), '품종별 중앙값 · ' + (price ? price.nVariety : 0) + '품종');
    if (price) h += kpi('대표 품종 평균가', n(price.repAvg) + '원', esc(price.repName) + ' · ' + esc(price.repUnit || ''));
    h += kpi('전주 대비 물량', pct(meta.week ? (meta.tot - meta.week) / meta.week * 100 : null), '전주 ' + n(meta.week) + 't');
    h += '</div>';

    h += introCard(meta, price, regs);

    h += '<h2>추이</h2><div class="cards">';
    h += '<div class="card"><h3>가격 추이</h3>' + challenge('대표 품종 ' + esc(ser.repNm || '—') + ' · 등급 상 평균가 (원)') +
      lineChart(ser.price, { color: color, label: '가격 추이' }) + '</div>';
    h += '<div class="card"><h3>반입량 추이</h3>' + challenge('일별 반입량 (톤)') +
      lineChart(ser.volume, { color: 'var(--muted)', label: '반입량 추이' }) + '</div>';
    h += '</div>';

    var units = (DATA.units || {})[state.item] || [];
    if (units.length) {
      h += '<h2>규격별 가격 · 전년 대비</h2>';
      h += '<div class="note" style="margin:0 0 10px">같은 품목도 포장 규격에 따라 단가가 갈립니다. ' +
        '단위단가로 비교하면 어떤 규격이 유리한지 바로 보입니다.</div>';
      h += '<div class="table-wrap"><table>' +
        '<thead><tr><th>품종</th><th>규격</th><th class="num">평균가</th><th class="num">단위단가</th>' +
        '<th class="num">최저</th><th class="num">최고</th>' +
        '<th class="num">전일비</th><th class="num">전년비</th></tr></thead><tbody>';
      units.forEach(function (u) {
        var up = u.up ? n(u.up.v) + '<span class="note"> 원/' + esc(u.up.b) + '</span>' : '—';
        h += '<tr><td class="strong">' + esc(u.nm) + '</td>' +
          '<td class="note">' + esc(u.unit) + '</td>' +
          '<td class="num strong">' + n(u.avg) + '</td><td class="num">' + up + '</td>' +
          '<td class="num">' + n(u.low) + '</td><td class="num">' + n(u.max) + '</td>' +
          '<td class="num ' + cls(u.pct) + '">' + pct(u.pct) + '</td>' +
          '<td class="num ' + cls(u.yoy) + '">' + pct(u.yoy) + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }

    // 수입 품목은 소스가 산지를 '기타' 하나로만 준다. 그때는 규격별 표와 숫자가
    // 똑같아 정보가 없으므로 표를 접고 이유만 알린다.
    var onlyEtc = regs.length > 0 && regs.every(function (g) { return g.region === '기타'; });
    if (onlyEtc) {
      h += '<h2>산지별 가격</h2>';
      h += '<div class="empty">이 품목은 산지가 <b>기타</b> 하나로만 집계됩니다. ' +
        '가락시장 산지 정보는 국내 시군구 단위라 수입 품목은 산지가 나뉘지 않습니다.</div>';
    }
    if (regs.length && !onlyEtc) {
      h += '<h2>산지별 가격</h2>';
      h += '<div class="note" style="margin:0 0 10px">품종·규격마다 상위 5개 산지까지 나옵니다. ' +
        '같은 품목도 산지에 따라 단가가 크게 갈립니다. 규격 안에서 싼 산지가 위로 옵니다.</div>';
      h += '<div class="table-wrap"><table>' +
        '<thead><tr><th>품종</th><th>규격</th><th>산지</th>' +
        '<th class="num">평균가</th><th class="num">최저</th><th class="num">최고</th>' +
        '<th class="num">최저산지 대비</th></tr></thead><tbody>';
      // 품종+규격 묶음의 최저 평균가를 기준으로 몇 % 비싼지 보여준다
      var base = {};
      regs.forEach(function (g) {
        var k = g.nm + '|' + g.unit;
        if (base[k] == null || g.avg < base[k]) base[k] = g.avg;
      });
      var prevKey = null;
      regs.forEach(function (g) {
        var k = g.nm + '|' + g.unit;
        var gap = base[k] ? (g.avg - base[k]) / base[k] * 100 : null;
        var newGroup = k !== prevKey; prevKey = k;
        h += '<tr' + (newGroup ? ' style="border-top:2px solid var(--line)"' : '') + '>' +
          '<td class="strong">' + (newGroup ? esc(g.nm) : '') + '</td>' +
          '<td class="note">' + (newGroup ? esc(g.unit) : '') + '</td>' +
          '<td>' + esc(g.region) + '</td>' +
          '<td class="num strong">' + n(g.avg) + '</td>' +
          '<td class="num">' + n(g.low) + '</td><td class="num">' + n(g.max) + '</td>' +
          '<td class="num ' + (gap > 0.05 ? 'up' : 'flat') + '">' +
            (gap == null ? '—' : gap < 0.05 ? '기준' : '+' + gap.toFixed(1) + '%') + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }

    if (price && price.varieties.length) {
      var gcount = {};
      price.varieties.forEach(function (v) { gcount[v.g] = (gcount[v.g] || 0) + 1; });
      h += '<h2>품종별 가격 · 전 등급</h2>';
      h += '<div class="gradebar"><span class="lab">등급</span>';
      GRADES.forEach(function (g) {
        if (!gcount[g.cd]) return;
        h += '<button type="button" class="gchip" data-g="' + g.cd + '">' + g.nm +
          '<span class="n">' + gcount[g.cd] + '</span></button>';
      });
      h += '<button type="button" class="gchip" data-g="all">전체<span class="n">' +
        price.varieties.length + '</span></button></div>';
      h += '<div class="searchbar">' +
        '<input class="search" id="vq" type="search" autocomplete="off" placeholder="품종명 또는 규격으로 검색 (예: 백도, 천도, 4kg)">' +
        '<span class="hits" id="vhits"></span>' +
        '<button type="button" class="clearq" id="vclear" hidden>지우기</button></div>';
      h += '<div class="table-wrap"><table>' +
        '<thead><tr><th>품종</th><th>등급</th><th>단위</th><th class="num">평균가</th><th class="num">단위단가</th>' +
        '<th class="num">최저</th><th class="num">최고</th>' +
        '<th class="num">전일비</th><th>7일 전</th><th>1년 전</th></tr></thead><tbody id="vbody">';
      price.varieties.forEach(function (v) {
        var q = ((v.nm || '') + ' ' + (v.unit || '') + ' ' + (v.cd || '') + ' ' + (v.gn || '')).toLowerCase();
        var up = v.up ? n(v.up.v) + '<span class="note"> 원/' + esc(v.up.b) + '</span>' : '—';
        h += '<tr data-q="' + esc(q) + '" data-g="' + esc(v.g) + '">' +
          '<td class="strong">' + esc(v.nm) + '</td>' +
          '<td class="gcell"><span class="gtag" style="color:' + gradeColor(v.g) + '">' + esc(v.gn) + '</span></td>' +
          '<td class="note">' + esc(v.unit) + '</td>' +
          '<td class="num strong">' + n(v.avg) + '</td><td class="num">' + up + '</td>' +
          '<td class="num">' + n(v.low) + '</td><td class="num">' + n(v.max) + '</td>' +
          '<td class="num ' + cls(v.pct) + '">' + pct(v.pct) + '</td>' +
          '<td class="note">' + esc(v.j7 || '—') + '</td><td class="note">' + esc(v.j365 || '—') + '</td></tr>';
      });
      h += '</tbody></table></div>';
    } else {
      h += '<div class="empty">이 품목은 해당일 경매 가격 데이터가 없습니다. 반입물량만 확인됩니다.</div>';
    }
    return h;
  }

  // H2 뒤에 곧바로 .cards가 오는 패턴을 감지해 .section 래퍼로 묶는다 —
  // 이렇게 하면 뷰 함수들을 안 건드리고도 "H2가 카드 안에 들어간" 시각 그룹이 된다.
  function wrapSections(root) {
    var h2s = Array.prototype.slice.call(root.querySelectorAll('h2'));
    h2s.forEach(function (h2) {
      if (h2.parentElement && h2.parentElement.classList.contains('section')) return;
      var next = h2.nextElementSibling;
      if (!next || !next.classList.contains('cards')) return;
      var sec = document.createElement('section');
      sec.className = 'section';
      h2.parentNode.insertBefore(sec, h2);
      sec.appendChild(h2);
      sec.appendChild(next);
    });
  }

  function render(push) {
    if (push !== false) syncHistory();
    renderNav();
    var v = $('view');
    v.innerHTML = state.level === 'all' ? viewAll() : state.level === 'sector' ? viewSector() : viewItem();
    wrapSections(v);
    wireSearch();
    v.querySelectorAll('[data-sector]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        var item = el.getAttribute('data-item');
        state.sector = el.getAttribute('data-sector');
        if (item) { state.item = item; state.level = 'item'; }
        else { state.item = null; state.level = 'sector'; }
        e.stopPropagation(); render(); window.scrollTo(0, 0);
      });
    });
  }

  // ---------- 브라우저 히스토리 ----------
  // 드릴다운 단계를 히스토리에 쌓아 뒤로가기가 사이트를 벗어나지 않게 한다.
  // 주소는 #청과/복숭아 형태라 그대로 공유하면 그 화면이 바로 열린다.
  function stateHash(st) {
    if (st.level === 'all') return '#';
    var h = '#' + encodeURIComponent(st.sector || '');
    if (st.item) h += '/' + encodeURIComponent(st.item);
    return h;
  }

  function parseHash(h) {
    var raw = String(h || '').replace(/^#/, '');
    if (!raw) return { level: 'all', sector: null, item: null };
    var parts = raw.split('/').map(decodeURIComponent);
    var sec = parts[0], item = parts[1];
    if (!DATA.sectors[sec]) return { level: 'all', sector: null, item: null };
    // 없는 품목이 주소에 있으면 부문 화면으로 떨어뜨린다
    if (item && !(DATA.sectors[sec] || []).some(function (x) { return x.item === item; })) item = null;
    return { level: item ? 'item' : 'sector', sector: sec, item: item || null };
  }

  function syncHistory() {
    var h = stateHash(state);
    if (h === location.hash || (h === '#' && !location.hash)) return;  // 같은 화면이면 안 쌓는다
    history.pushState({ level: state.level, sector: state.sector, item: state.item }, '', h);
  }

  window.addEventListener('popstate', function (e) {
    // 뒤로/앞으로 — 히스토리에 담긴 상태가 있으면 그대로, 없으면 주소에서 읽는다
    state = e.state && e.state.level ? e.state : parseHash(location.hash);
    render(false);
    window.scrollTo(0, 0);
  });

  // 백스페이스로도 뒤로 — 단, 입력 중일 때는 글자 지우기를 방해하면 안 된다
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Backspace' || e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target;
    var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (typing) return;
    if (state.level === 'all') return;   // 최상위에서는 사이트를 벗어나지 않게 둔다
    e.preventDefault();
    history.back();
  });

  function wireSearch() {
    // 레벨2는 품목(iq/ibody), 레벨3은 품종(vq/vbody). 동작은 같다.
    [['iq', 'ibody', 'ihits', 'iclear', '품목'],
     ['vq', 'vbody', 'vhits', 'vclear', '품종']].forEach(function (cfg) {
      var box = $(cfg[0]);
      if (!box) return;
      var body = $(cfg[1]), hits = $(cfg[2]), clear = $(cfg[3]), unit = cfg[4];
      var rows = Array.prototype.slice.call(body.querySelectorAll('tr[data-q]'));
      var none = null;

      function apply() {
        // 공백으로 나눈 토큰을 모두 포함하는 행만 남긴다 ("천도 10kg" 같은 조합 검색)
        var terms = box.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
        var shown = 0;
        rows.forEach(function (tr) {
          var g = tr.getAttribute('data-g');
          // 등급 칩은 품종 표(vbody)에만 있다. 품목 표(ibody)에는 data-g가 없다.
          var gOk = (g == null) || gradeSel === 'all' || g === gradeSel;
          var top = tr.getAttribute('data-top');
          var topOk = top == null || terms.length > 0 || top === '1';
          var ok = gOk && topOk && terms.every(function (t) { return (tr.getAttribute('data-q') || '').indexOf(t) > -1; });
          tr.hidden = !ok;
          if (ok) shown++;
        });
        hits.textContent = terms.length ? shown + ' / ' + rows.length + unit + ' (전 부문)' : '전 부문 ' + rows.length + unit;
        clear.hidden = !terms.length;

        if (!shown) {
          if (!none) {
            none = document.createElement('tr');
            none.innerHTML = '<td colspan="9" style="text-align:center;color:var(--muted);padding:22px">' +
              '일치하는 ' + unit + '이 없습니다.</td>';
            body.appendChild(none);
          }
          none.hidden = false;
        } else if (none) { none.hidden = true; }
      }

      box.addEventListener('input', apply);
      clear.addEventListener('click', function () { box.value = ''; apply(); box.focus(); });

      // 등급 칩 (품종 표에만 존재)
      var chips = Array.prototype.slice.call(document.querySelectorAll('.gchip'));
      if (chips.length && cfg[1] === 'vbody') {
        // 현재 선택된 등급이 이 품목에 없으면 가장 가까운 등급으로 되돌린다
        var avail = {};
        rows.forEach(function (tr) { avail[tr.getAttribute('data-g')] = 1; });
        if (gradeSel !== 'all' && !avail[gradeSel]) gradeSel = avail[GRADE_DEFAULT] ? GRADE_DEFAULT : 'all';

        function paint() {
          chips.forEach(function (c) { c.classList.toggle('on', c.getAttribute('data-g') === gradeSel); });
        }
        chips.forEach(function (c) {
          c.addEventListener('click', function () {
            gradeSel = c.getAttribute('data-g');
            paint(); apply();
          });
        });
        paint();
      }

      apply();
    });
  }

  function renderNews() {
    var list = DATA.news || [];
    var el = $('news');
    if (!list.length) { el.innerHTML = ''; return; }
    var span = DATA.newsSpan;
    var h = '<h2 style="font-size:14.5px;color:var(--chae);letter-spacing:.4px">📰 농산물 뉴스 · ' +
      (span ? '최근 ' + span + '일 (D-' + span + ' ~ D)' : '최근 자료') + '</h2>';
    if (span > 5) h += '<div class="note" style="margin:0 0 10px">최근 5일 내 게시물이 적어 ' + span + '일로 넓혔습니다.</div>';
    h += '<div class="newslist">';
    list.slice(0, 12).forEach(function (a) {
      h += '<a class="newsitem" href="' + esc(a.url) + '" target="_blank" rel="noopener">' +
        '<span class="d">' + esc((a.posted || '').slice(5)) + '</span>' +
        '<span class="t">' + esc(a.title) + '</span>' +
        '<span class="b">' + esc(a.board) + '</span></a>';
    });
    el.innerHTML = h + '</div>';
  }

  var upd = DATA.updated || {};
  var updHtml = '';
  var parts = [];
  if (upd['채소']) parts.push('채소 갱신 <b>' + esc(upd['채소'].slice(5)) + '</b>');
  if (upd['청과']) parts.push('청과 갱신 <b>' + esc(upd['청과'].slice(5)) + '</b>');
  updHtml = parts.join(' <span class="meta-sep">·</span> ');
  if (!updHtml) updHtml = '갱신 ' + esc(DATA.generated);
  $('meta').innerHTML = '기준일 <b>' + esc(DATA.priceDate || DATA.volumeDate || '—') + '</b>' +
    ' <span class="meta-sep">·</span> ' + updHtml;

  $('bigback').addEventListener('click', function () {
    // 히스토리를 소비해 브라우저 뒤로가기와 동작을 맞춘다
    if (history.state && history.state.level && history.state.level !== 'all') history.back();
    else {
      if (state.level === 'item') { state.level = 'sector'; state.item = null; }
      else state = { level: 'all', sector: null, item: null };
      render(); window.scrollTo(0, 0);
    }
  });

  renderNews();
  state = parseHash(location.hash);
  history.replaceState({ level: state.level, sector: state.sector, item: state.item }, '', stateHash(state));
  render(false);
})();
</script>
</body>
</html>
